name: smart_medicine_cabinet
description: "Smart Medicine Cabinet - reminders, expiry alerts, prescription scanning, and drug info lookup."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^6.1.0
  flutter_timezone: ^3.0.1
  shared_preferences: ^2.3.0
  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.6

  # Local notifications (Reminder / Expiry engine)
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Custom reminder ringtone picker
  file_picker: ^8.1.2

  # Emergency contact call button on the alarm screen
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alarm_tone.mp3